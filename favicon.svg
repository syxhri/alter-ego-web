<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" shape-rendering="crispEdges">
  <!-- Offset shadow (neobrutalist) -->
  <rect x="3" y="3" width="36" height="36" rx="4" fill="#1A1A1A"/>
  <!-- Left half — lavender -->
  <rect x="0" y="0" width="19" height="36" rx="3" fill="#D4BBFF"/>
  <!-- Right half — mint -->
  <rect x="19" y="0" width="19" height="36" rx="3" fill="#B5EDDA"/>
  <!-- Outer border -->
  <rect x="0" y="0" width="38" height="36" rx="3" fill="none" stroke="#1A1A1A" stroke-width="2.5"/>
  <!-- Centre divider -->
  <rect x="18" y="0" width="2" height="36" fill="#1A1A1A"/>
  <!-- Diamond star at top-centre -->
  <polygon points="19,3 21,7 19,11 17,7" fill="#1A1A1A"/>
  <!-- Letter A -->
  <text x="9.5" y="28" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="17" font-weight="900" fill="#1A1A1A">A</text>
  <!-- Letter E -->
  <text x="28.5" y="28" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="17" font-weight="900" fill="#1A1A1A">E</text>
</svg>
